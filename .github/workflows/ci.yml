# Lint, test and build on every push and pull request.
#
# No Supabase secrets are needed here: the test suite mocks the Supabase client,
# and the production build tolerates missing VITE_ vars (the app then renders its
# "finish setup" screen instead of failing).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # vite 8 requires ^20.19 || >=22.12; vitest 4 requires ^20 || ^22 || >=24
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build